<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      // import {
      //   reactive,
      //   effect,
      //   computed,
      // } from "/node_modules/@vue/reactivity/dist/reactivity.esm-browser.js";

      import { reactive, watch } from "./reactivity.esm.js";
      const state = reactive({ name: "name1", age: 12, flag: true });

      watch(
        () => state.name,
        (newVal, oldVal) => {
          console.log("watch", newVal, oldVal);
        },
        {
          immediate: true,
        }
      );
      setTimeout(() => {
        state.name = "name2";
      }, 1000);
    </script>
  </body>
</html>
