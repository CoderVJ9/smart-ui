<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      // import {
      //   createRenderer,
      //   h,
      //   render,
      // } from "/node_modules/@vue/runtime-dom/dist/runtime-dom.esm-browser.js";

      import { render, h, Text, Fragment } from "./runtime-dom.esm.js";

      const componentA = {
        data() {
          return {
            age: 12,
          };
        },
        render() {
          setTimeout(() => {
            this.age++;
            this.age++;
          }, 1000);
          return h("div", this.age);
        },
      };
      render(h(componentA), document.getElementById("app"));
    </script>
  </body>
