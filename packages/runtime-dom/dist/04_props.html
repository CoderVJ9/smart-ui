<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      // import {
      //   createRenderer,
      //   h,
      //   render,
      //   getCurrentInstance,
      //   Fragment,
      // } from "/node_modules/@vue/runtime-dom/dist/runtime-dom.esm-browser.js";

      import { render, h, Text, Fragment } from "./runtime-dom.esm.js";

      const componentB = {
        props: {
          a: String,
        },
        render() {
          return h("div", this.a);
        },
      };

      const componentA = {
        data() {
          return {
            isShow: false,
          };
        },
        render() {
          return h(Fragment, [
            h(
              "button",
              {
                onClick: () => {
                  this.isShow = !this.isShow;
                },
              },
              "点我"
            ),
            h(componentB, { a: this.isShow ? "显示" : "隐藏" }),
          ]);
        },
      };
      render(h(componentA), document.getElementById("app"));
    </script>
  </body>
</html>
