<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      // import {
      //   createRenderer,
      //   h,
      //   render,
      //   getCurrentInstance,
      //   Fragment,
      //   ref,
      // } from "/node_modules/@vue/runtime-dom/dist/runtime-dom.esm-browser.js";

      import {
        render,
        h,
        Text,
        Fragment,
        ref,
        onMounted,
        getCurrentInstance,
        defineAsyncComponent,
      } from "./runtime-dom.esm.js";

      const AsyncComponent = defineAsyncComponent({
        loader: () => {
          return new Promise((resolve, reject) => {
            setTimeout(() => {
              resolve({
                render: () => h("div", "hello"),
              });
            }, 2000);
          });
        },
        errorComponent: {
          render: () => h("div", "错误了"),
        },
        loadingComponent: {
          render: () => h("div", "loading..."),
        },
        delay: 1000,
        timeout: 1000,
        onError(err, retry, fail, attempts) {
          console.log("重新加载", attempts);
          retry();
        },
      });
      render(h(AsyncComponent), app);
    </script>
  </body>
</html>
