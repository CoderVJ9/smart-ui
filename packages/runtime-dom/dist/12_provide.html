        onMounted,
        getCurrentInstance,
        defineAsyncComponent,
        Teleport,
        provide,

      } from "./runtime-dom.esm.js";
      const GrandSon = {
        setup() {
          const state = inject("name", "默认值");
          const age = inject("age", "默认值");
          return () => h("div", state.value + "---" + age);
        },
      };
      const Son = {
        setup() {
          provide("age", 222);

          return () => h(GrandSon);
        },
      };

      const Home = {
        setup() {
          const state = ref("lv");
          provide("name", state);
          provide("age", 12);

          return () => h(Fragment, null, [h(Son), h("div", null, state.value)]);
        },
      };
      render(h(Home), app);
